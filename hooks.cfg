# hooks.cfg — agents that support a "startup" (SessionStart) hook, managed via `install.sh --hook`
#
# Each non-comment, non-blank line declares one agent:
#   name|SETTINGS_FILE|NEEDS_MATCHER|FORMAT
#
#   name           identifier used by `--tool <name>` / `--<name>` / `--all`
#   SETTINGS_FILE  path to the agent's hook/settings JSON; ~ expands to $HOME
#   NEEDS_MATCHER  "yes" adds a SessionStart matcher "startup" (CodeBuddy-style);
#                  "no"  omits the matcher (matches every session start)
#   FORMAT         JSON schema family written by install.sh:
#                     claude  -> {"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":CMD}]}]}}
#                                (Claude Code, CodeBuddy, Codex, Gemini)
#                     cursor  -> {"version":1,"hooks":{"sessionStart":[{"command":CMD}]}}
#                                (Cursor — camelCase event, flat command handler)
#                     trae    -> {"version":1,"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":CMD}]}]}}
#                                (Trae — SessionStart event + top-level "version":1)
#
# To add another agent, append one line here — no change to install.sh is required.
# Agents absent from this file are skipped with a "not yet supported" notice; we
# never write a guessed config that could corrupt an agent we don't understand.
#
# Confidence: all entries below are verified against official docs.

# Verified
claude|~/.claude/settings.json|no|claude
codebuddy|~/.codebuddy/settings.json|yes|claude
codex|~/.codex/hooks.json|no|claude
gemini|~/.gemini/settings.json|no|claude
trae|~/.trae-cn/hooks.json|no|trae

# Verified (Cursor-style schema)
cursor|~/.cursor/hooks.json|no|cursor

# Not in this file (see README "Not yet supported"): qoder (no SessionStart event,
# only UserPromptSubmit/PreToolUse/PostToolUse/PostToolUseFailure/Stop — a Stop hook
# is not a meaningful startup auto-update), cline, continue, copilot (cloud-agent only),
# opencode, openclaw, windsurf, zed, kilo (unverified), hermes (YAML), kimi (TOML),
# goose (plugin manifest).
