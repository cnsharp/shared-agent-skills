# hooks.cfg — agents that support a "startup" (SessionStart) hook, managed via `install.sh --hook`
#
# Each non-comment, non-blank line declares one agent:
#   name|SETTINGS_FILE|NEEDS_MATCHER|FORMAT
#
#   name           identifier used by `--tool <name>` / `--<name>` / `--all`
#   SETTINGS_FILE  path to the agent's hook/settings JSON; ~ expands to $HOME
#   NEEDS_MATCHER  "yes" adds a SessionStart matcher "startup" (CodeBuddy-style);
#                  "no"  omits the matcher (matches every session start)
#   FORMAT         schema family written by install.sh: claude | cursor | trae | hermes | kimi | autohand
#                     claude/cursor/trae -> JSON settings; hermes -> YAML (config.yaml);
#                     kimi -> TOML (config.toml [[hooks]]); autohand -> JSON (config.json hooks.hooks[])
#
# To add another agent, append one line here — no change to install.sh is required.
# NOTE: Grok was evaluated but EXCLUDED — its hooks are registered at runtime via client/RPC
#       (ClientHooks), not a static ~/.grok/hooks/*.json file, so no static format exists yet.

autohand|~/.autohand/config.json|no|autohand
claude|~/.claude/settings.json|no|claude
codebuddy|~/.codebuddy/settings.json|yes|claude
codex|~/.codex/hooks.json|no|claude
cursor|~/.cursor/hooks.json|no|cursor
gemini|~/.gemini/settings.json|no|claude
hermes|~/.hermes/config.yaml|no|hermes
kimi|~/.kimi-code/config.toml|no|kimi
qwen-code|~/.qwen/settings.json|no|claude
trae|~/.trae/hooks.json|no|trae
trae-cn|~/.trae-cn/hooks.json|no|trae
