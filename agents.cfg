# agents.cfg — agent targets supported by install.sh
#
# Each non-comment, non-blank line declares one agent:
#   name|ENV_VAR|DEFAULT_DIR
#
#   name         lowercase identifier used by `--tool <name>` and the `--<name>` convenience alias
#   ENV_VAR      environment variable that, if set, overrides DEFAULT_DIR
#   DEFAULT_DIR  default skills directory (expanded with $HOME)
#
# To add a new agent, append one line here — no change to install.sh is required.
# These default directories follow each tool's current convention; override via the
# matching environment variable if your install differs.
#
# NOTE: the shared hub (~/.agents/skills, the Open Agent Skills standard) is NOT listed
# here as an agent — it is defined as a constant in install.sh / install.ps1. Agents that
# read the hub directly (codebuff, codex, goose, zed) simply have DEFAULT_DIR=~/.agents/skills
# and are auto-skipped by the bridge loop.

amp|AMP_SKILLS_DIR|~/.config/amp/skills
ante|ANTE_SKILLS_DIR|~/.ante/skills
antigravity|ANTIGRAVITY_SKILLS_DIR|~/.gemini/config/skills
aug|AUG_SKILLS_DIR|~/.augment/skills
autohand|AUTOHAND_SKILLS_DIR|~/.autohand/skills
claude|CLAUDE_SKILLS_DIR|~/.claude/skills
