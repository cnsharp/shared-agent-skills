# agents.cfg — agent targets supported by install.sh
#
# Each non-comment, non-blank line declares one agent:
#   name|ENV_VAR|DEFAULT_DIR
#
#   name         lowercase identifier used by `--tool <name>` and the `--<name>` convenience alias
#   ENV_VAR      environment variable that, if set, overrides DEFAULT_DIR
#   DEFAULT_DIR  default skills directory (expanded with $HOME)
#
# To add a new agent, append one line here — no change to install.sh is required.
# These default directories follow each tool's current convention; override via the
# matching environment variable if your install differs.

agents|AGENTS_SKILLS_DIR|~/.agents/skills
claude|CLAUDE_SKILLS_DIR|~/.claude/skills
cline|CLINE_SKILLS_DIR|~/.cline/skills
codebuddy|CODEBUDDY_SKILLS_DIR|~/.codebuddy/skills
codex|CODEX_SKILLS_DIR|~/.agents/skills
copilot|COPILOT_SKILLS_DIR|~/.copilot/skills
cursor|CURSOR_SKILLS_DIR|~/.cursor/skills
gemini|GEMINI_SKILLS_DIR|~/.gemini/skills
goose|GOOSE_SKILLS_DIR|~/.agents/skills
hermes|HERMES_SKILLS_DIR|~/.hermes/skills
kilo|KILO_SKILLS_DIR|~/.kilo/skills
kimi|KIMI_SKILLS_DIR|~/.kimi-code/skills
openclaw|OPENCLAW_SKILLS_DIR|~/.openclaw/skills
opencode|OPENCODE_SKILLS_DIR|~/.config/opencode/skills
qoder|QODER_SKILLS_DIR|~/.qoder/skills
trae|TRAE_SKILLS_DIR|~/.trae/skills
trae-cn|TRAE_CN_SKILLS_DIR|~/.trae-cn/skills
windsurf|WINDSURF_SKILLS_DIR|~/.codeium/windsurf/skills
workbuddy|WORKBUDDY_SKILLS_DIR|~/.workbuddy/skills
zed|ZED_SKILLS_DIR|~/.agents/skills
